name: Setup Charm Environment
description: Install tools for charm development and CI

inputs:
  charmcraft:
    description: Install charmcraft
    default: "true"
  lxd:
    description: Setup LXD for building charms
    default: "false"
  juju:
    description: Setup Juju and K8s substrate
    default: "false"
  substrate:
    description: K8s substrate (microk8s or k8s)
    default: "microk8s"
  substrate-channel:
    description: Substrate snap channel
    default: "1.32-strict/stable"
  juju-channel:
    description: Juju snap channel
    default: "3.6/stable"
  charmcraft-channel:
    description: Charmcraft snap channel
    default: "latest/stable"
  extra-debs:
    description: Additional apt packages to install (comma-separated)
    default: ""
  automatically-retry-hooks:
    description: Whether Juju should automatically retry failed hooks
    default: "true"
  classic-microk8s:
    description: Reinstall MicroK8s with --classic flag (required for NFS)
    default: "false"
  configure-cni-for-istio:
    description: Apply Cilium settings required by Istio sidecars. No-op unless substrate is k8s.
    default: "false"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "**/uv.lock"

    - name: Install yq
      shell: bash
      run: sudo snap install yq

    - name: Install charmcraft
      if: inputs.charmcraft == 'true'
      shell: bash
      run: sudo snap install charmcraft --classic --channel="${{ inputs.charmcraft-channel }}"

    - name: Setup LXD
      if: inputs.lxd == 'true'
      uses: canonical/setup-lxd@main

    - name: Setup Juju and K8s substrate via concierge
      if: inputs.juju == 'true'
      shell: bash
      env:
        CONCIERGE_JUJU_CHANNEL: ${{ inputs.juju-channel }}
        CONCIERGE_MICROK8S_CHANNEL: ${{ inputs.substrate-channel }}
        CONCIERGE_K8S_CHANNEL: ${{ inputs.substrate-channel }}
        CONCIERGE_CHARMCRAFT_CHANNEL: ${{ inputs.charmcraft-channel }}
      run: |
        sudo snap install concierge --classic
        extra_debs_flag=""
        if [[ -n "${{ inputs.extra-debs }}" ]]; then
          extra_debs_flag="--extra-debs=${{ inputs.extra-debs }}"
        fi
        trace_flag=""
        if [[ "${{ inputs.substrate }}" == "k8s" ]]; then
          trace_flag="--trace"
        fi
        sudo concierge prepare -p "${{ inputs.substrate }}" --extra-snaps=astral-uv $extra_debs_flag $trace_flag
        sudo snap install kubectl --classic
        juju model-defaults automatically-retry-hooks="${{ inputs.automatically-retry-hooks }}"

    - name: Re-home pods that started before the CNI
      # Canonical K8s reports the cluster ready before ck-network finishes installing, so
      # pods scheduled in that window fall back to containerd's own bridge (10.88.0.0/16)
      # and never get a Cilium identity, while their replacements sit unschedulable behind
      # the node.cilium.io/agent-not-ready taint. CoreDNS has been observed split across
      # both states, one replica stranded on the bridge and the other not ready, leaving
      # the cluster with no DNS that a pod can actually reach. Concierge creates these
      # pods itself, so they can only be corrected after the fact.
      if: inputs.juju == 'true' && inputs.substrate == 'k8s'
      shell: bash
      run: |
        set -euo pipefail

        kubectl -n kube-system rollout status daemonset/cilium --timeout=300s
        kubectl -n kube-system rollout status deployment/cilium-operator --timeout=300s

        all_pods() {
          kubectl get pods -A \
            -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}'
        }
        # Host-networked pods share the node namespace and never hold an identity.
        excluded() {
          kubectl get pods -A \
            -o jsonpath='{range .items[?(@.spec.hostNetwork==true)]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}'
          kubectl get ciliumendpoints -A \
            -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}'
        }

        stranded=$(comm -23 <(all_pods | sort) <(excluded | sort -u) || true)
        if [[ -n "$stranded" ]]; then
          echo "::warning::Pods started before the CNI was installed: $(echo "$stranded" | tr '\n' ' ')"

          # Best effort: a failure here is not worth aborting every charm's pipeline over.
          # The Juju controller is included: a charm agent that has replaced its default
          # route reaches the controller over the pod network, so one stranded there fails
          # every agent that restarts afterwards.
          for pod in $stranded; do
            namespace="${pod%%/*}"
            name="${pod##*/}"
            echo "Deleting $pod so its controller recreates it under Cilium."
            kubectl -n "$namespace" delete pod "$name" --wait=false || true
          done
        else
          echo "Every pod holds a Cilium identity."
        fi

        # DNS and the controller are what charm agents depend on, so wait for both.
        kubectl -n kube-system rollout status deployment/coredns --timeout=300s
        for namespace in $(kubectl get namespaces -o name | sed 's|namespace/||' | grep '^controller-'); do
          kubectl -n "$namespace" rollout status statefulset/controller --timeout=300s
        done
        kubectl -n kube-system wait --for=condition=Ready pods --all --timeout=300s || true

    - name: Configure Cilium for Istio
      # Cilium's socket-level LB rewrites service VIP -> pod IP inside the pod netns, so an
      # Istio sidecar never sees the VIP and cannot route. Restricting socket LB to the host
      # netns pushes pod traffic back through per-packet LB.
      # https://docs.cilium.io/en/stable/network/servicemesh/istio/
      if: inputs.juju == 'true' && inputs.configure-cni-for-istio == 'true' && inputs.substrate == 'k8s'
      shell: bash
      run: |
        set -euo pipefail
        kubectl -n kube-system patch configmap cilium-config --type merge \
          --patch '{"data":{"bpf-lb-sock-hostns-only":"true"}}'
        kubectl -n kube-system rollout restart daemonset cilium
        kubectl -n kube-system rollout status daemonset cilium --timeout=300s

    - name: Reinstall MicroK8s with classic confinement
      if: inputs.juju == 'true' && inputs.classic-microk8s == 'true' && inputs.substrate == 'microk8s'
      shell: bash
      run: |
        # Destroy existing juju controller
        juju destroy-controller microk8s --destroy-all-models --destroy-storage --no-prompt || true
        # Remove strict microk8s
        sudo snap remove microk8s --purge
        # Install classic microk8s
        sudo snap install microk8s --channel="${{ inputs.substrate-channel }}" --classic
        # Wait for microk8s to be ready
        sudo microk8s status --wait-ready
        # Enable required addons
        sudo microk8s enable dns hostpath-storage metallb:10.64.140.43-10.64.140.49
        # Add microk8s to juju and bootstrap
        sudo microk8s config | juju add-k8s mcrk8s --client
        juju bootstrap mcrk8s mcrk8s
        juju add-model --config logging-config="<root>=WARNING; unit=DEBUG" --config update-status-hook-interval="60m" testing

    - name: Grant MetalLB RBAC for status CRDs
      # metallb v0.15.x ships the configurationstates/servicebgpstatuses/servicel2statuses
      # CRDs, but the microk8s addon's bundled RBAC omits perms for them, crash-looping
      # the controller/speaker so LoadBalancer Services never get an IP. Upstream fix
      # (canonical/microk8s-core-addons#405) is unmerged; grant the perms additively so
      # this is a no-op once the addon ships correct RBAC.
      if: inputs.juju == 'true' && inputs.substrate == 'microk8s'
      shell: bash
      run: |
        set -euo pipefail
        if ! sudo microk8s kubectl get ns metallb-system >/dev/null 2>&1; then
          echo "metallb-system namespace absent; skipping RBAC patch"
          exit 0
        fi
        cat <<'EOF' | sudo microk8s kubectl apply -f -
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: microk8s-metallb-status-crds
        rules:
          - apiGroups: ["metallb.io"]
            resources:
              - configurationstates
              - configurationstates/status
              - servicebgpstatuses
              - servicebgpstatuses/status
              - servicel2statuses
              - servicel2statuses/status
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: microk8s-metallb-status-crds
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: microk8s-metallb-status-crds
        subjects:
          - kind: ServiceAccount
            name: controller
            namespace: metallb-system
          - kind: ServiceAccount
            name: speaker
            namespace: metallb-system
        EOF
        sudo microk8s kubectl -n metallb-system rollout restart deploy/controller ds/speaker
        sudo microk8s kubectl -n metallb-system rollout status deploy/controller --timeout=120s
        sudo microk8s kubectl -n metallb-system rollout status ds/speaker --timeout=120s
