name: Integration Tests

on:
  workflow_call:
    inputs:
      charm-path:
        description: Path to charm directory (use "." for standalone repos)
        type: string
        default: "."
      use-parrot:
        description: Wrap test execution with parrot auto-healing
        type: boolean
        default: false
      extra-debs:
        description: Additional apt packages (comma-separated)
        type: string
        default: ""
      substrate:
        description: K8s substrate (microk8s or k8s)
        type: string
        default: "microk8s"
      substrate-channel:
        description: Substrate snap channel
        type: string
        default: "1.32-strict/stable"
      automatically-retry-hooks:
        description: Whether Juju should automatically retry failed hooks
        type: boolean
        default: true
      integration-runner:
        description: Default runner for integration tests
        type: string
        default: "ubuntu-latest"
      self-hosted-runner:
        description: Self-hosted runner label for specific suites
        type: string
        default: ""
      self-hosted-suites:
        description: JSON array of suite filenames to run on self-hosted runner
        type: string
        default: "[]"
      run-cleanup:
        description: Run cleanup after integration tests
        type: boolean
        default: false
      load-nfs-modules:
        description: Load NFS kernel modules before integration tests
        type: boolean
        default: false
      classic-microk8s-suites:
        description: JSON array of suite filenames requiring classic MicroK8s
        type: string
        default: "[]"
      configure-cni-for-istio:
        description: Apply Cilium settings required by Istio sidecars (k8s substrate only)
        type: boolean
        default: false
      exclude-suites:
        description: JSON array of suite filenames to drop from the matrix
        type: string
        default: "[]"
      include-suites:
        description: JSON array of suite filenames to run exclusively, overriding discovery
        type: string
        default: "[]"
      soft-fail:
        description: Report failures as an issue instead of failing the workflow
        type: boolean
        default: false
      timeout-minutes:
        description: Timeout for the test execution step
        type: number
        default: 60
    secrets:
      WIREGUARD_PRIVATE_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      LOGFIRE_TOKEN:
        required: false
      CHARMARR_PARROT_APP_ID:
        required: false
      CHARMARR_PARROT_APP_PRIVATE_KEY:
        required: false
    outputs:
      artifact-name:
        description: Name of the built charm artifact
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build Charm
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@v6

      - uses: charmarr/.github/actions/charm/setup@v2
        with:
          lxd: "true"

      - id: artifact-name
        shell: bash
        run: |
          if [[ "${{ inputs.charm-path }}" == "." ]]; then
            echo "name=charm-${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=charm-$(echo '${{ inputs.charm-path }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
          fi

      - uses: charmarr/.github/actions/charm/build@v2
        with:
          charm-path: ${{ inputs.charm-path }}
          artifact-name: ${{ steps.artifact-name.outputs.name }}

  matrix:
    name: Define matrix
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate matrix
        id: suites
        working-directory: ${{ inputs.charm-path }}
        env:
          EXCLUDE_SUITES: ${{ inputs.exclude-suites }}
          INCLUDE_SUITES: ${{ inputs.include-suites }}
        run: |
          set -euo pipefail
          if [[ ! -d "tests/integration" ]]; then
            echo "suites=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          found="$(find tests/integration -name 'test_*.py' -printf '%f\n' | jq -R -n -c '[inputs]')"
          if [[ "$INCLUDE_SUITES" != "[]" ]]; then
            # Fail loudly rather than silently matching nothing, since an empty
            # matrix skips the job and would look like a pass.
            missing="$(jq -n -c --argjson f "$found" --argjson i "$INCLUDE_SUITES" '$i - $f')"
            if [[ "$missing" != "[]" ]]; then
              echo "::error::include-suites names suites that do not exist: $missing"
              exit 1
            fi
            list="$INCLUDE_SUITES"
          else
            list="$(jq -n -c --argjson f "$found" --argjson e "$EXCLUDE_SUITES" '$f - $e')"
          fi
          echo "suites=$list" >> "$GITHUB_OUTPUT"

  integration:
    name: Integration (${{ matrix.suite }})
    needs: [build, matrix]
    if: needs.matrix.outputs.suites != '[]'
    runs-on: ${{ contains(fromJSON(inputs.self-hosted-suites), matrix.suite) && inputs.self-hosted-runner || inputs.integration-runner }}
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.matrix.outputs.suites) }}
    steps:
      - name: Generate parrot token
        if: inputs.use-parrot || runner.debug == '1'
        id: parrot-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CHARMARR_PARROT_APP_ID }}
          private-key: ${{ secrets.CHARMARR_PARROT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.parrot-token.outputs.token || github.token }}

      - uses: actions/checkout@v6
        if: inputs.use-parrot || runner.debug == '1'
        with:
          repository: charmarr/parrot
          ref: v1
          path: parrot

      - uses: actions/checkout@v6
        if: inputs.use-parrot || runner.debug == '1'
        with:
          repository: charmarr/charmarr-lib
          path: charmarr-lib

      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ inputs.charm-path }}

      - name: Clean runner caches
        continue-on-error: true
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Clean stale state
        if: contains(fromJSON(inputs.self-hosted-suites), matrix.suite)
        continue-on-error: true
        uses: charmarr/.github/actions/charm/cleanup@v2

      - name: Setup NFS prerequisites
        if: inputs.load-nfs-modules
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-common
          sudo modprobe nfs
          sudo modprobe nfsv4
          sudo modprobe nfsd

      - uses: charmarr/.github/actions/charm/setup@v2
        with:
          juju: "true"
          extra-debs: ${{ inputs.extra-debs }}
          substrate: ${{ inputs.substrate }}
          substrate-channel: ${{ inputs.substrate-channel }}
          automatically-retry-hooks: ${{ inputs.automatically-retry-hooks }}
          classic-microk8s: ${{ contains(fromJSON(inputs.classic-microk8s-suites), matrix.suite) }}
          configure-cni-for-istio: ${{ inputs.configure-cni-for-istio }}

      - name: Run integration tests
        id: run-tests
        continue-on-error: ${{ inputs.soft-fail }}
        timeout-minutes: ${{ inputs.timeout-minutes }}
        working-directory: ${{ inputs.charm-path }}
        run: |
          set -euo pipefail
          charm_file="$(find . -maxdepth 1 -name '*.charm' -print -quit)"
          if [[ -z "$charm_file" ]]; then
            echo "::error::No .charm file found"
            exit 1
          fi
          export CHARM_PATH
          CHARM_PATH="$(realpath "$charm_file")"
          if [[ "${{ inputs.use-parrot }}" == "true" ]] || [[ "${{ runner.debug }}" == "1" ]]; then
            uv run --project "${{ github.workspace }}/parrot" python -m parrot integration \
              --charm-path "$(pwd)" \
              --suite "${{ matrix.suite }}" \
              --extra-index "${{ github.workspace }}/charmarr-lib"
          else
            uvx tox -e integration -- -k "${{ matrix.suite }}"
          fi
        env:
          WIREGUARD_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          GH_TOKEN: ${{ steps.parrot-token.outputs.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Report soft failure
        if: always() && inputs.soft-fail && steps.run-tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Integration failure: ${{ inputs.charm-path }} / ${{ matrix.suite }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$(printf '`%s` failed in `%s`.\n\nRun: %s\n' \
            "${{ matrix.suite }}" "${{ inputs.charm-path }}" "$RUN_URL")"
          existing="$(gh issue list --state open --limit 200 \
            --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

  cleanup:
    name: Cleanup Self-Hosted Runner
    needs: integration
    if: always() && inputs.run-cleanup
    runs-on: ${{ inputs.self-hosted-runner }}
    steps:
      - uses: charmarr/.github/actions/charm/cleanup@v2
