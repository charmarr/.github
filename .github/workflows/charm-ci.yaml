name: Charm CI

on:
  workflow_call:
    inputs:
      charm-path:
        description: Path to charm directory (use "." for standalone repos)
        type: string
        default: "."
      run-lint:
        description: Run lint checks
        type: boolean
        default: true
      run-static:
        description: Run static type checks
        type: boolean
        default: true
      run-unit:
        description: Run unit tests
        type: boolean
        default: true
      run-terraform-validate:
        description: Validate Terraform files
        type: boolean
        default: true
      use-parrot:
        description: Wrap test execution with parrot auto-healing
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      LOGFIRE_TOKEN:
        required: false
      CHARMARR_PARROT_APP_ID:
        required: false
      CHARMARR_PARROT_APP_PRIVATE_KEY:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.charm-path }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    if: inputs.run-lint
    runs-on: ubuntu-latest
    steps:
      - name: Generate parrot token
        if: inputs.use-parrot
        id: parrot-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CHARMARR_PARROT_APP_ID }}
          private-key: ${{ secrets.CHARMARR_PARROT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.parrot-token.outputs.token || github.token }}

      - uses: actions/checkout@v6
        if: inputs.use-parrot
        with:
          repository: charmarr/parrot
          path: parrot

      - uses: actions/checkout@v6
        if: inputs.use-parrot
        with:
          repository: charmarr/charmarr-lib
          path: charmarr-lib

      - uses: charmarr/.github/actions/charm/setup@v2

      - name: Run lint
        working-directory: ${{ inputs.charm-path }}
        run: |
          if [[ "${{ inputs.use-parrot }}" == "true" ]]; then
            uv run --project "${{ github.workspace }}/parrot" python -m parrot lint \
              --charm-path "$(pwd)" \
              --extra-index "${{ github.workspace }}/charmarr-lib"
          else
            uvx tox -e lint
          fi
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          GH_TOKEN: ${{ steps.parrot-token.outputs.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}

  static:
    name: Static Analysis
    if: inputs.run-static
    runs-on: ubuntu-latest
    steps:
      - name: Generate parrot token
        if: inputs.use-parrot
        id: parrot-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CHARMARR_PARROT_APP_ID }}
          private-key: ${{ secrets.CHARMARR_PARROT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.parrot-token.outputs.token || github.token }}

      - uses: actions/checkout@v6
        if: inputs.use-parrot
        with:
          repository: charmarr/parrot
          path: parrot

      - uses: actions/checkout@v6
        if: inputs.use-parrot
        with:
          repository: charmarr/charmarr-lib
          path: charmarr-lib

      - uses: charmarr/.github/actions/charm/setup@v2

      - name: Run static checks
        working-directory: ${{ inputs.charm-path }}
        run: |
          if [[ "${{ inputs.use-parrot }}" == "true" ]]; then
            uv run --project "${{ github.workspace }}/parrot" python -m parrot static \
              --charm-path "$(pwd)" \
              --extra-index "${{ github.workspace }}/charmarr-lib"
          else
            uvx tox -e static
          fi
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          GH_TOKEN: ${{ steps.parrot-token.outputs.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}

  unit:
    name: Unit Tests
    if: inputs.run-unit
    runs-on: ubuntu-latest
    steps:
      - name: Generate parrot token
        if: inputs.use-parrot
        id: parrot-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CHARMARR_PARROT_APP_ID }}
          private-key: ${{ secrets.CHARMARR_PARROT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.parrot-token.outputs.token || github.token }}

      - uses: actions/checkout@v6
        if: inputs.use-parrot
        with:
          repository: charmarr/parrot
          path: parrot

      - uses: actions/checkout@v6
        if: inputs.use-parrot
        with:
          repository: charmarr/charmarr-lib
          path: charmarr-lib

      - uses: charmarr/.github/actions/charm/setup@v2

      - name: Run unit tests
        working-directory: ${{ inputs.charm-path }}
        run: |
          if [[ "${{ inputs.use-parrot }}" == "true" ]]; then
            uv run --project "${{ github.workspace }}/parrot" python -m parrot unit \
              --charm-path "$(pwd)" \
              --extra-index "${{ github.workspace }}/charmarr-lib"
          else
            uvx tox -e unit
          fi
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          GH_TOKEN: ${{ steps.parrot-token.outputs.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}

  terraform-validate:
    name: Validate Terraform
    if: inputs.run-terraform-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install OpenTofu
        run: sudo snap install opentofu --classic

      - name: Validate Terraform
        working-directory: ${{ inputs.charm-path }}
        run: |
          tofu fmt -check -recursive -diff
          if [ -d "terraform" ]; then
            cd terraform
            tofu init -backend=false
            tofu validate
          else
            echo "No terraform directory found, skipping validation"
          fi
